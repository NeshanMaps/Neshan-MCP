[project]
name = "neshan-mcp"
version = "0.3.0"
description = "Model Context Protocol (MCP) server for Neshan Maps Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
neshan-mcp = "neshan_mcp.index:main"
neshan-mcp-http = "neshan_mcp.indexHttp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neshan_mcp"]
